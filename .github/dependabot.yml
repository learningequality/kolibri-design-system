# Automatically update versions for npm

version: 2
updates:

  # Maintain dependencies for Javascript
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      babel:
        patterns:
          - "@babel/*"
    ignore:
      # vue2-teleport >= 1.2.0 reads HTMLElement at module load, breaking SSR.
      - dependency-name: "vue2-teleport"
        versions: [">=1.2.0"]

  # Maintain dependencies for Github Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github:
        patterns:
          - "actions/*"
